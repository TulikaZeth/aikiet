# GitHub actions workflow
# GitHub automatically looks for workflow files in the .github/workflows directory
# Give it a meaningful name
name: Iris ML API - CI Pipeline

# Define when GitHub should run the workflow
on:
  # Run the workflow on push to main branch
  push:
    branches: [ main ]
  # Run the workflow on pull request to main branch
  pull_request:
    branches: [ main ]
  # Allow manual run of the workflow from GitHub UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu VM for each job
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlops-first-pipeline

    steps:
      # Checkout the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python on Runner
      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Automated Tests
      - name: Run Automated Tests
        run: |
          python -m pytest -v

      # Step 5: Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t iris-ml-api:${{ github.sha }} .
